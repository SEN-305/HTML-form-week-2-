<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Bio-Data Form</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: rgb(244, 244, 249);
            color: rgb(51, 51, 51);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        
        form {
            background-color: rgb(255, 255, 255);
            padding: 25px;
            border-radius: 6px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0px 2px 8px rgba(0, 0, 0, 0.1);
            border: 1px solid rgb(220, 220, 220);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.25rem;
            text-align: center;
            color: rgb(30, 30, 30);
        }

        
        .form-group {
            margin-bottom: 12px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: rgb(85, 85, 85);
            font-weight: bold;
        }

        input[type="text"],
        input[type="email"],
        select {
            width: 100%;
            padding: 8px;
            border: 1px solid rgb(204, 204, 204);
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 0.9rem;
            background-color: rgb(255, 255, 255);
            color: rgb(30, 30, 30);
        }

       
        .radio-group {
            display: flex;
            gap: 15px;
            margin-top: 4px;
        }

        .radio-group label {
            font-weight: normal;
            cursor: pointer;
            color: rgb(51, 51, 51);
        }

        .radio-group input {
            width: auto;
            margin-right: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: rgb(0, 102, 204);
            color: rgb(255, 255, 255);
            border: none;
            border-radius: 4px;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: rgb(0, 82, 163);
        }

        
        #message {
            margin-top: 12px;
            font-size: 0.85rem;
            text-align: center;
            font-weight: bold;
        }

        .error {
            color: rgb(217, 83, 79);
        }

        .success {
            color: rgb(92, 184, 92);
        }
    </style>
</head>
<body>

    <form id="bioForm">
        <h2>Student Bio-Data</h2>

       
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="eg:Francis ">
        </div>

        
        <div class="form-group">
            <label for="studentId">Student ID</label>
            <input type="text" id="studentId" placeholder="e.g:12368">
        </div>

        
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="e.g:francis@example.com">
        </div>

        
        <div class="form-group">
            <label>Gender</label>
            <div class="radio-group">
                <label><input type="radio" name="gender" value="Male"> Male</label>
                <label><input type="radio" name="gender" value="Female"> Female</label>
            </div>
        </div>

        
        <div class="form-group">
            <label for="department">Department</label>
            <select id="department">
                <option value="">-- Select Department --</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Software Engineering">Software Engineering</option>
                <option value="Information Technology">Information Technology</option>
            </select>
        </div>

        <button type="submit">Submit</button>

       
        <div id="message"></div>
    </form>

    <script>
        document.getElementById('bioForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            
            const name = document.getElementById('fullName').value.trim();
            const id = document.getElementById('studentId').value.trim();
            const email = document.getElementById('email').value.trim();
            const gender = document.querySelector('input[name="gender"]:checked');
            const dept = document.getElementById('department').value;
            const msg = document.getElementById('message');

            
            if (!name || !id || !email || !gender || !dept) {
                msg.textContent = "Please fill in all required fields.";
                msg.className = "error";
                return;
            }

            
            if (!email.includes('@')) {
                msg.textContent = "Please enter a valid email address (missing '@').";
                msg.className = "error";
                return;
            }

            
            msg.textContent = "successfully Registered";
            msg.className = "success";

            
            document.getElementById('bioForm').reset();
        });
    </script>

</body>
</html>
