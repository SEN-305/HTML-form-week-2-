<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Bio-Data Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      padding: 30px;
    }

    .form-container {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 0 10px #bbb;
    }

    h2 {
      text-align: center;
      color: #1d4ed8;
    }

    label {
      display: block;
      margin-top: 12px;
      font-weight: bold;
    }

    input, select, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #aaa;
      border-radius: 5px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      border: none;
      border-radius: 5px;
      background: #1d4ed8;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #153eaa;
    }

    #message {
      text-align: center;
      color: green;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Student Bio-Data Form</h2>

    <form id="bioForm">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" required />

      <label for="email">Email Address</label>
      <input type="email" id="email" required />

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" required />

      <label for="dob">Date of Birth</label>
      <input type="date" id="dob" required />

      <label for="gender">Gender</label>
      <select id="gender" required>
        <option value="">Select gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
      </select>

      <label for="course">Course of Study</label>
      <input type="text" id="course" required />

      <label for="address">Address</label>
      <textarea id="address" rows="4" required></textarea>

      <button type="submit">Submit Bio-Data</button>
      <p id="message"></p>
    </form>
  </div>

  <script>
    document.getElementById("bioForm").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("message").textContent =
        "Bio-data submitted successfully!";
      this.reset();
    });
  </script>
</body>
</html>
